[env:esp32c3]
platform = espressif32 @ 6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
; Two ~1.9MB OTA app slots. Application firmware uploaded later through the
; web page MUST be built with this same partition table (OTA cannot change it).
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
extra_scripts = post:merge_bin.py
