# Push a tag like "ionctl-v1.0.1" to build the .deb and publish it as a release.
name: Release ionctl

on:
  push:
    tags: ["ionctl-v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        run: |
          version="$(python3 host/build_deb.py --print-version)"
          if [ "ionctl-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Build package
        run: |
          echo "DEB=$(python3 host/build_deb.py --out-dir dist)" >> "$GITHUB_ENV"

      - name: Check package
        run: |
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable name too, so .../releases/latest/download/<name> always works.
          cp "$DEB" dist/ion-multiio-tools_latest_all.deb
          gh release create "$GITHUB_REF_NAME" "$DEB" dist/ion-multiio-tools_latest_all.deb \
            --title "ionctl ${GITHUB_REF_NAME#ionctl-v}" \
            --notes "Install on Debian: \`sudo apt install ./$(basename "$DEB")\`, or see the README."
